dataset:
  name: dataco
  raw_path: data/raw/dataco/DataCoSupplyChainDataset.csv
  encoding: latin1
  k_core: 5
  audit_k_values: [3, 5, 10]
  min_interactions_for_loo: 3

feedback:
  mode: binary
  confidence_alpha: 1.0

model:
  embedding_dim: 32
  mlp_layers: [64, 32, 16, 8]
  dropout: 0.2
  pretrain_alpha: 0.5

training:
  batch_size: 256
  negative_ratio: 4
  pretrain_optimizer: adam
  pretrain_lr: 0.001
  finetune_optimizer: sgd
  finetune_lr: 0.01
  weight_decay: 0.000001
  max_epochs_pretrain: 50
  max_epochs_finetune: 50
  patience: 10
  monitor: NDCG@10
  device: auto
  seed: 42

evaluation:
  primary: full_ranking
  k_values: [1, 5, 10, 20]
  sampled_negatives: 99
  tie_break_seed: 2026
  include_redundant_metrics: true
  head_fraction: 0.10

baselines:
  enabled: [random, popularity, itemknn, bpr, categorypopularity]
  bpr:
    embedding_dim: 32
    epochs: 30
    lr: 0.03
    reg: 0.005

paths:
  outputs_dir: outputs
